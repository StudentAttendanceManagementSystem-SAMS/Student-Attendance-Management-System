{% extends "base.html" %}
{% block title %}Subjects{% endblock %}
{% block content %}
<h1>Subjects</h1>
<p><a class="button" href="{% url 'masterdata:subject_create' %}">Add subject</a></p>
<table>
  <thead>
    <tr><th>Code</th><th>Name</th><th>Semester</th></tr>
  </thead>
  <tbody>
    {% for subject in subjects %}
    <tr>
      <td>{{ subject.code }}</td>
      <td>{{ subject.name }}</td>
      <td>{{ subject.semester }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No subjects yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
