{% extends "base.html" %}
{% block title %}Sections{% endblock %}
{% block content %}
<h1>Sections</h1>
<table>
  <thead>
    <tr><th>Name</th><th>Semester</th><th>Academic year</th></tr>
  </thead>
  <tbody>
    {% for section in sections %}
    <tr>
      <td>{{ section.name }}</td>
      <td>{{ section.semester }}</td>
      <td>{{ section.academic_year }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No sections yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
