{% if form.non_field_errors %}<div class="alert alert-error">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
  <div class="profile-field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="profile-help">{{ field.help_text }}</small>{% endif %}
    {% if field.errors %}<div class="field-error">{{ field.errors }}</div>{% endif %}
  </div>
{% endfor %}
