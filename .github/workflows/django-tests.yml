name: SAMS Quality Checks

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python manage.py test accounts masterdata analytics

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests
        run: |
          python manage.py test attendance.test_integration

  system-tests:
    name: System tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run system tests
        run: |
          python manage.py test dashboard.test_system profiles

  coverage:
    name: Code and branch coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage
      - name: Run full suite with statement and branch coverage
        run: |
          coverage run --rcfile=.coveragerc --branch manage.py test
          coverage report --rcfile=.coveragerc --show-missing
          coverage xml --rcfile=.coveragerc -o coverage.xml
          coverage html --rcfile=.coveragerc -d htmlcov
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sams-coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  ci-gate:
    name: CI result
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, system-tests, coverage]
    if: always()
    steps:
      - name: Fail if any required quality job failed
        run: |
          echo "Unit: ${{ needs.unit-tests.result }}"
          echo "Integration: ${{ needs.integration-tests.result }}"
          echo "System: ${{ needs.system-tests.result }}"
          echo "Coverage: ${{ needs.coverage.result }}"
          test "${{ needs.unit-tests.result }}" = "success"
          test "${{ needs.integration-tests.result }}" = "success"
          test "${{ needs.system-tests.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
